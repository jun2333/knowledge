<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC案例:实现水平垂直居中</title>
    <style>
        .container{
            width: 100%;
            background-color: #615e5e;
            text-align: center;
            padding: 20px 0;
        }
        .child{
            display: inline-block;
            width: 50px;
            height: 50px;
            background-color: #000;
            /* 内联元素直接在垂直区域的对其方式 */
            vertical-align: middle; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>
</html>
